<div class="body">

     <!-- IMAGEN -->
     <div class="image-fondo">
          <img src="https://i0.wp.com/travelandleisure-es.com/wp-content/uploads/2024/06/vacaciones-en-familia.jpg?resize=1536%2C1024&ssl=1"
               alt="Descripción de la imagen">
     </div>

     <!-- CONTENEDOR LOGIN -->
     <div class="card-container">

          <mat-card class="contenedor">

               <div class="content-logi">

                    <mat-card-header>
                         <mat-card-title>Registrarse</mat-card-title>
                    </mat-card-header>
                    <mat-card-content *ngIf="!regist">
                         <form class="form-custom" [formGroup]="formRegistro">
                              <!-- NOMBRE -->
                              <mat-form-field class="input-custom">
                                   <mat-label>Nombre</mat-label>
                                   <!-- <input matInput formControlName="nombre"> -->
                                   <input matInput maxlength="20" formControlName="nombre" (keypress)="soloLetras($event)"/>
                              </mat-form-field>

                              <!-- APELLIDOS -->
                              <mat-form-field class="input-custom">
                                   <mat-label>Apellidos</mat-label>
                                   <!-- <input matInput formControlName="nombre"> -->
                                   <input matInput maxlength="20" formControlName="apellidos" (keypress)="soloLetras($event)"/>
                              </mat-form-field>

                              <!-- TELEFONO -->
                              <mat-form-field class="input-custom">
                                   <mat-label>Telefono</mat-label>
                                   <!-- <input matInput formControlName="dni"> -->
                                   <input matInput maxlength="9" inputmode="numeric" formControlName="telefono" (keypress)="soloNumeros($event)"/>
                              </mat-form-field>

                              <!-- BOTONES -->
                              <div class="flex">
                                   <button mat-flat-button color="warn" 
                                   (click)="volver()" >Volver</button>

                                   <button mat-flat-button 
                                   color="primary" 
                                   style="margin-left:8px"
                                   (click)="continuar()">Continuar</button>
                              </div>
                         </form>
                    </mat-card-content>

                    <mat-card-content *ngIf="regist">
                         <form class="form-custom" [formGroup]="formRegistro">
                              
                              <!-- DNI -->
                              <mat-form-field class="input-custom">
                                   <mat-label>Documento</mat-label>
                                   <!-- <input matInput formControlName="dni"> -->
                                   <input matInput maxlength="8" inputmode="numeric" formControlName="documento" (keypress)="soloNumeros($event)"/>
                              </mat-form-field>
                              
                              <!-- CORREO -->
                              <mat-form-field class="input-custom">
                                   <mat-label>Email</mat-label>
                                   <!-- <input matInput formControlName="correo"> -->
                                   <input matInput maxlength="30" type="email" formControlName="email"/>
                              </mat-form-field>
                              
                              <!-- CONTRASEÑA -->
                              <mat-form-field class="input-custom">
                                   <mat-label>Contraseña</mat-label>
                                   <!-- <input matInput formControlName="clave" type="password"> -->
                                   <input matInput maxlength="20" type="password"  formControlName="password"/>
                              </mat-form-field>

                              <!-- BOTONES -->
                              <div class="flex">
                                   
                                   <button mat-flat-button color="warn" 
                                   (click)="Regresar()" >Regresar</button>
                                   <button mat-flat-button 
                                   color="primary" 
                                   style="margin-left:8px"
                                   (click)="registrarse()">Registrarse</button>
                              </div>
                         </form>
                    </mat-card-content>
               </div>
               <div class="creador"> Creado por TuPapi</div>
          </mat-card>
     </div>
</div>
