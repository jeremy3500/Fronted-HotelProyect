<div class="body">

     <!-- IMAGEN -->
     <div class="image-fondo">
          <img src="https://cache.marriott.com/content/dam/marriott-digital/si/cala/hws/l/limsi/en_us/photo/unlimited/assets/si-limsi-hotel-exterior--16528.jpg"
               alt="Descripción de la imagen">
     </div>

     <!-- CONTENEDOR LOGIN -->
     <div class="card-container">

          <mat-card class="contenedor">

               <div class="content-logi">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/Sheraton_%281%29.svg/330px-Sheraton_%281%29.svg.png" alt="" class="milogo">
                    <!-- TITULO -->
                    <mat-card-header>
                         <mat-card-title class="title">Inicio de Sesion</mat-card-title>
                    </mat-card-header>

                    <!-- INPUTS -->
                    <mat-card-content>
                         <form class="form-custom" [formGroup]="formLogin">
                              <div class="input-container">
                                   <input matInput formControlName="correo" class="miinput" required placeholder=" " maxlength="37" />
                                   <label>Email o Documento</label>
                              </div>

                              <div class="input-container" style="margin-top:12px">
                                   <input matInput formControlName="clave" class="miinput" required placeholder=" " maxlength="30" type="password" style="font-size: 25px; padding: 7px 10px;"/>
                                   <label>Contraseña</label>
                              </div>

                              <!-- BOTONES -->
                              <div class="misbotones">
                                   <button (click)="iniciarSesion()" class="iniSesion">Iniciar Sesion</button>
                                   <button (click)="registrarse()" class="registro">Registrarse</button>
                              </div>
                         </form>
                    </mat-card-content>
               </div>
               <div class="creador"> Creado por TuPapi</div>
          </mat-card>
     </div>
</div>
